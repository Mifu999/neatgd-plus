name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: geode-sdk/build-geode-mod@main

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: output-windows
          path: output/*.geode
          if-no-files-found: error
